services:
  postgresdb:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: psqldb
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data


  mongodb:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: mongodb
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
volumes:
  pg_data:
  mongo_data:

