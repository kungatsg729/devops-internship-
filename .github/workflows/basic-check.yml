name: Basic DevOps Check
on:
  push:
    branches: [ main, week2-git-cicd ]
  pull_request:
    branches: [ main ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Show repository files
        run: ls -la
      - name: Run shell syntax check  
        run: bash -n week1/scripts/system_info.sh
